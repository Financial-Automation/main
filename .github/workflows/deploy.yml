name: Deploy Financial Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Continuous Integration & Regression Gate
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: "test"
      JWT_SECRET: "ci-test-jwt-secret-do-not-use-in-production-123456"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Install Backend Dependencies
        run: |
          cd backend
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          cd ..

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Build Frontend
        run: |
          export NODE_OPTIONS="--max-old-space-size=2048"
          npm run build
          test -f dist/index.html

      - name: Run Backend Unit Tests (In-Memory MongoDB)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
        run: |
          cd backend
          npm test
          cd ..

      - name: Run Security & Middleware Scenarios
        run: |
          node --test tests/auth_middleware.test.js tests/auth_security_scenarios.test.js tests/cashflow_payroll.test.js

      - name: Run Golden-Flow Regression Suite (Isolated MongoMemoryServer)
        env:
          CI: "true"
          USE_IN_MEMORY_DB: "true"
          BLOCK_PROD_FALLBACK: "true"
          DEV_MODE: "true"
          NODE_ENV: "test"
          TEST_PORT: "5098"
        run: |
          npm run test

  deploy:
    name: Deploy to Production
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy to AWS
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_SHA: ${{ github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ssh ubuntu@"$SERVER_IP" \
            "DEPLOY_SHA='$DEPLOY_SHA' GEMINI_API_KEY='$GEMINI_API_KEY' bash -s" <<'ENDSSH'
          set -euo pipefail

          APP_DIR="/home/ubuntu/main"
          WEB_DIR="/var/www/financial-automation"

          echo "=========================================="
          echo "Deploying Financial Automation"
          echo "Commit: $DEPLOY_SHA"
          echo "App:    $APP_DIR"
          echo "Web:    $WEB_DIR"
          echo "=========================================="

          sudo -u ubuntu -H env \
            APP_DIR="$APP_DIR" \
            WEB_DIR="$WEB_DIR" \
            DEPLOY_SHA="$DEPLOY_SHA" \
            GEMINI_API_KEY="${GEMINI_API_KEY:-}" \
            bash -s <<'APPSSH'
          set -euo pipefail

          cd "$APP_DIR"

          echo "Fetching GitHub main..."
          git fetch origin main

          echo "Protecting production environment files..."

          if [ -f .env ]; then
            cp -p .env /tmp/financial-automation.env
          fi

          if [ -f backend/.env ]; then
            cp -p backend/.env /tmp/financial-automation-backend.env
          fi

          echo "Checking deployment commit..."
          git cat-file -e "$DEPLOY_SHA^{commit}"

          echo "Resetting to exact deployment commit..."
          git reset --hard "$DEPLOY_SHA"

          echo "Restoring production environment files..."

          if [ -f /tmp/financial-automation.env ]; then
            cp -p /tmp/financial-automation.env .env
          fi

          if [ -f /tmp/financial-automation-backend.env ]; then
            cp -p /tmp/financial-automation-backend.env backend/.env
          fi

          if [ -f backend/.env ] && [ -n "${GEMINI_API_KEY:-}" ]; then
            if grep -q "^GEMINI_API_KEY=" backend/.env; then
              sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" backend/.env
            else
              echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> backend/.env
            fi
          fi

          if [ -f backend/.env ]; then
            if ! grep -q "^GEMINI_MODEL=" backend/.env; then
              echo "GEMINI_MODEL=gemini-3.8-flash" >> backend/.env
            fi
          fi

          CURRENT_SHA="$(git rev-parse HEAD)"

          if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ]; then
            echo "ERROR: Commit verification failed"
            echo "Expected: $DEPLOY_SHA"
            echo "Actual:   $CURRENT_SHA"
            exit 1
          fi

          echo "Verified commit: $CURRENT_SHA"

          echo "Installing backend dependencies..."
          cd "$APP_DIR/backend"

          if [ -f package-lock.json ]; then
            npm ci --omit=dev --no-audit --no-fund
          else
            npm install --omit=dev --no-audit --no-fund
          fi

          if [ -f requirements.txt ]; then
            if [ ! -d venv ]; then
              python3 -m venv venv
            fi

            venv/bin/pip install --upgrade pip
            venv/bin/pip install -r requirements.txt
          fi

          echo "Building frontend..."
          cd "$APP_DIR"

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

          export NODE_OPTIONS="--max-old-space-size=2048"

          npm run build

          test -f "$APP_DIR/dist/index.html"

          echo "Publishing frontend..."
          sudo mkdir -p "$WEB_DIR"
          sudo rsync -a --delete "$APP_DIR/dist/" "$WEB_DIR/"
          sudo chown -R www-data:www-data "$WEB_DIR"

          echo "Restarting backend..."
          export PM2_HOME="/home/ubuntu/.pm2"
          export PATH="$PATH:/home/ubuntu/.nvm/versions/node/$(ls /home/ubuntu/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/home/ubuntu/.npm-global/bin:/usr/bin"

          cd "$APP_DIR/backend"
          sudo fuser -k 5000/tcp || true
          pm2 startOrRestart ecosystem.config.cjs --update-env || pm2 restart financial-backend --update-env || pm2 start server.js --name financial-backend
          pm2 save || true

          echo "Backend status:"
          pm2 describe financial-backend | grep -E "status|script path|exec cwd"

          APPSSH

          echo "Testing Nginx..."
          sudo nginx -t

          echo "Reloading Nginx..."
          sudo systemctl reload nginx

          echo "Verifying production deployment..."

          cd "$APP_DIR"

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "ERROR: Production commit mismatch"
            echo "Expected: $DEPLOY_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          test -f "$WEB_DIR/index.html"

          echo "Checking live frontend..."
          curl -fsS https://software.saaiss.in/ > /dev/null

          echo "Checking live backend health..."
          curl -fsS http://localhost:5001/api/health > /dev/null

          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "Commit: $ACTUAL_SHA"
          echo "=========================================="
          ENDSSH
